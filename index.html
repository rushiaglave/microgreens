
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prakriti Greens | Premium Living Superfoods</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --emerald-glow: 0 0 30px rgba(74, 222, 128, 0.15);
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050805;
            color: #e5e7eb;
            overflow-x: hidden;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .text-neon-green { color: #4ade80; }
        .bg-emerald-glass {
            background: rgba(5, 8, 5, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(74, 222, 128, 0.1);
        }
        .product-card {
            background: linear-gradient(145deg, #0d120d, #080b08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .product-card:hover {
            border-color: rgba(74, 222, 128, 0.4);
            transform: translateY(-12px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), var(--emerald-glow);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050805; }
        ::-webkit-scrollbar-thumb { background: #1a2e1a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4ade80; }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floating-leaf {
            animation: float 8s ease-in-out infinite;
        }

        /* Prevent Layout Shift */
        #root { min-height: 100vh; }
    </style>
